<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../css/login.css">
    <title>Document</title>
</head>
<body>
    <h1>sign in</h1>
    <form action="home.html" method="post" class="login-form">
        <label>first name</label><br>
        <input type="text" name="first name" placeholder="Enter your first name" required><br><br>
        <label>last name</label><br>
        <input type="text" name="last name" placeholder="Enter your secound name" required><br><br>
        <label>email</label><br>
        <input type="email"  placeholder="enter your e-mail" required><br><br>
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username"  required><br><br>
        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" placeholder="0108805010" required><br><br>
      <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>
        <label for="confirm-password">Confirm Password:</label><br>
        <input type="password" id="confirm-password" name="confirm-password" required><br><br>
        <label for="remember">Remember me</label>
        <input type="checkbox" id="remember" name="remember"><br><br>
        <input type="submit" value="Sign In">
    </form>
    

<script>
    const form = document.querySelector("form");

    form.addEventListener("submit", function(event) {
        event.preventDefault(); // وقف إرسال الفورم
        window.location.href = "home.html"; // تحويل مباشر
    });
</script>

</body>
</html>
